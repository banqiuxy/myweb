<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#150a2e" />
    <meta name="description" content="心念塔罗 · 沉浸式三牌阵抽取，AI 为你解读命运。" />
    <title>心念塔罗 · 三牌阵</title>
    <link rel="icon" href="assets/images/head.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@1,400;1,500&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/shared.css">
    <link rel="stylesheet" href="css/tarot.css">
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>✦ 心念塔罗</h1>
        <p class="sub">抽取你的答案</p>
      </div>

      <!-- 步骤1：输入问题 -->
      <div id="stepInput">
        <input type="text" id="questionInput" placeholder="请输入你心中想问的问题…" maxlength="50" />
        <button class="btn-main" id="confirmBtn">确认问题，开始抽牌 ✨</button>
      </div>

      <!-- 步骤2：选择3张牌 -->
      <div id="stepSelect">
        <div class="instruction">
          请在下方牌阵中，选择你心仪的 <span>3</span> 张牌（已选 <span id="selectCount">0</span>/3）
        </div>
        <div id="cardGrid"></div>
        <button class="btn-main" id="revealBtn" disabled>揭示命运之牌 🔮</button>
      </div>

      <!-- 步骤3：展示结果 -->
      <div id="stepResult">
        <div class="result-grid" id="resultGrid"></div>
        <div id="readingResult"></div>

        <div id="followUpArea">
          <span class="follow-label">💬 继续追问（AI 会结合上下文回答）</span>
          <div class="follow-input-group">
            <input type="text" id="followInput" placeholder="输入你想追问的问题…" maxlength="100" />
            <button class="btn-follow" id="followBtn">发送追问 ✨</button>
          </div>
        </div>

        <button class="btn-reset" id="resetBtn">🔄 重新占卜</button>
      </div>
    </div>

    <script src="js/tarot/tarot.js"></script>
  </body>
</html>
