<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#150a2e" />
    <meta name="description" content="心念塔罗 · 沉浸式三牌阵抽取，AI 为你解读命运。" />
    <title>心念塔罗 · 三牌阵</title>
    <link rel="icon" href="../head.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@1,400;1,500&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
      /* ============================================================
         心念塔罗 — Premium 液态毛玻璃重构
         设计语言：真实玻璃 / 星空氛围 / 呼吸感排版 / 分层动效
         ============================================================ */
      * { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --font-body: "Outfit", "PingFang SC", "Microsoft YaHei", sans-serif;
        --font-serif: "Cormorant Garamond", "Songti SC", serif;
        --font-mono: "JetBrains Mono", ui-monospace, monospace;

        --bg-1: #150a2e;
        --bg-2: #2a1552;
        --glass: rgba(255, 255, 255, 0.05);
        --glass-strong: rgba(255, 255, 255, 0.09);
        --glass-border: rgba(255, 255, 255, 0.12);
        --glass-inner: rgba(255, 255, 255, 0.06);

        --accent: #b388ff;
        --accent-2: #7c4dff;
        --gold: #e8c56a;
        --text-mut: rgba(255, 255, 255, 0.65);

        --r-lg: 32px;
        --r-md: 18px;
        --shadow: 0 30px 70px -20px rgba(0, 0, 0, 0.7);
      }

      html { scroll-behavior: smooth; }
      body {
        min-height: 100dvh;
        display: flex; justify-content: center; align-items: center;
        font-family: var(--font-body);
        background: linear-gradient(150deg, var(--bg-1), var(--bg-2));
        color: #fff; padding: 15px; overflow-x: hidden;
      }
      ::selection { background: rgba(179,136,255,.4); }

      /* 星空背景 */
      body::before {
        content: ""; position: fixed; inset: 0; z-index: -2;
        background:
          radial-gradient(2px 2px at 10% 20%, rgba(255,255,255,.85), transparent 50%),
          radial-gradient(2px 2px at 50% 82%, rgba(255,255,255,.6), transparent 50%),
          radial-gradient(1.6px 1.6px at 78% 34%, rgba(255,255,255,.7), transparent 50%),
          radial-gradient(1.6px 1.6px at 30% 70%, rgba(255,255,255,.55), transparent 50%),
          radial-gradient(2.4px 2.4px at 88% 72%, rgba(255,255,255,.5), transparent 50%),
          radial-gradient(1.4px 1.4px at 15% 88%, rgba(255,255,255,.6), transparent 50%);
        background-size: 220px 220px;
      }
      /* 氛围光晕 */
      body::after {
        content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
        background:
          radial-gradient(900px 500px at 20% -8%, rgba(179,136,255,.16), transparent 60%),
          radial-gradient(700px 400px at 100% 110%, rgba(124,77,255,.18), transparent 60%);
      }

      /* 主容器 —— 真玻璃 */
      .container {
        position: relative;
        background: var(--glass);
        backdrop-filter: blur(28px) saturate(140%);
        -webkit-backdrop-filter: blur(28px) saturate(140%);
        padding: 28px 22px 36px;
        border-radius: var(--r-lg);
        border: 1px solid var(--glass-border);
        box-shadow: var(--shadow), inset 0 1px 0 var(--glass-inner);
        text-align: center; width: 100%; max-width: 760px;
        overflow: hidden;
      }
      /* 顶部流光带 */
      .container::before {
        content: ""; position: absolute; top: 0; left: 12%; right: 12%; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent);
      }
      .header h1 {
        font-size: 26px; font-weight: 300; letter-spacing: 5px;
        background: linear-gradient(130deg, #d4b6ff, #88d0ff);
        -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        margin-bottom: 22px;
        font-family: var(--font-serif);
      }
      .header .sub {
        font-size: 12.5px; color: var(--text-mut); letter-spacing: 2px;
        margin-top: -14px; margin-bottom: 20px;
      }

      /* --- 阶段1：问题输入区 --- */
      #stepInput { display: flex; flex-direction: column; gap: 16px; align-items: center; margin-bottom: 20px; }
      #stepInput input {
        width: 100%; max-width: 400px;
        background: var(--glass-strong); border: 1px solid var(--glass-border);
        border-radius: 40px; padding: 14px 22px; color: #fff; font-size: 16px;
        outline: none; transition: border-color .3s, box-shadow .3s; font-family: inherit;
      }
      #stepInput input:focus {
        border-color: var(--accent); box-shadow: 0 0 0 4px rgba(179,136,255,.15), 0 0 18px rgba(179,136,255,.15);
      }
      #stepInput input::placeholder { color: rgba(255,255,255,.4); }
      .error-shake { animation: shake .4s; border-color: #ff6b6b !important; }
      @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 50%{transform:translateX(6px);} 75%{transform:translateX(-3px);} }
      .btn-main {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        border: none; color: #fff; padding: 14px 48px; border-radius: 40px;
        font-size: 16px; font-weight: 600; cursor: pointer; font-family: inherit;
        box-shadow: 0 8px 26px -10px rgba(124,77,255,.6);
        transition: transform .2s cubic-bezier(.2,.8,.2,1), box-shadow .25s, opacity .2s;
        position: relative; overflow: hidden;
      }
      .btn-main::after {
        content: ""; position: absolute; inset: 0;
        background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,.25) 50%, transparent 70%);
        transform: translateX(-100%); transition: transform .6s;
      }
      .btn-main:hover { transform: translateY(-2px); box-shadow: 0 12px 32px -10px rgba(124,77,255,.75); }
      .btn-main:hover::after { transform: translateX(100%); }
      .btn-main:active { transform: scale(.96); }
      .btn-main:disabled { opacity: .5; cursor: not-allowed; transform: none; }

      /* --- 阶段2：牌阵区 --- */
      #stepSelect { display: none; flex-direction: column; align-items: center; }
      .instruction { font-size: 14px; color: var(--text-mut); letter-spacing: 1px; margin-bottom: 20px; }
      .instruction span { color: var(--gold); font-weight: 700; }
      #cardGrid {
        display: flex; flex-wrap: wrap; justify-content: center; gap: 9px;
        margin-bottom: 26px; max-height: 400px; overflow-y: auto; padding: 10px;
        scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.2) transparent;
      }
      #cardGrid::-webkit-scrollbar { width: 4px; }
      #cardGrid::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 10px; }
      .mini-card {
        width: 50px; height: 70px;
        background: radial-gradient(circle at 30% 30%, #4b2a6e, #1f1240);
        border: 1px solid var(--glass-border); border-radius: 9px;
        display: flex; justify-content: center; align-items: center;
        font-size: 20px; color: var(--gold); cursor: pointer;
        transition: transform .2s cubic-bezier(.2,.8,.2,1), border-color .2s, box-shadow .2s;
        box-shadow: 0 4px 12px rgba(0,0,0,.3); position: relative; font-family: inherit;
      }
      .mini-card:hover { transform: translateY(-6px) scale(1.05); border-color: var(--accent); box-shadow: 0 10px 24px rgba(179,136,255,.25); }
      .mini-card.selected {
        border: 2px solid var(--gold); box-shadow: 0 0 18px rgba(232,197,106,.5);
        transform: scale(1.06);
      }
      .mini-card.selected::after {
        content: ""; position: absolute; top: -2px; right: -2px; width: 12px; height: 12px;
        background: var(--gold); border-radius: 50%; box-shadow: 0 0 10px var(--gold);
      }

      /* --- 阶段3：展示结果 --- */
      #stepResult { display: none; width: 100%; margin-top: 10px; animation: fadeUp .5s cubic-bezier(.2,.8,.2,1); }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
      .result-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 15px; }
      .result-card {
        background: linear-gradient(160deg, #f8f7fc, #e2dfec);
        color: #333; padding: 16px 6px; border-radius: var(--r-md);
        box-shadow: 0 12px 28px rgba(0,0,0,.35); min-height: 150px;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        position: relative; overflow: hidden;
        animation: cardPop .5s cubic-bezier(.2,.8,.2,1) backwards;
      }
      .result-card:nth-child(1) { animation-delay: .1s; }
      .result-card:nth-child(2) { animation-delay: .22s; }
      .result-card:nth-child(3) { animation-delay: .34s; }
      @keyframes cardPop { from { opacity: 0; transform: translateY(14px) scale(.96); } to { opacity: 1; transform: none; } }
      .result-card::before {
        content: ""; position: absolute; top: 0; left: 8%; right: 8%; height: 2px;
        background: linear-gradient(90deg, transparent, rgba(124,77,255,.5), transparent);
      }
      .result-card .icon { font-size: 32px; margin-bottom: 8px; }
      .result-card .cn { font-size: 18px; font-weight: 700; font-family: var(--font-serif); }
      .result-card .en { font-size: 12px; color: #777; margin-top: 4px; font-family: var(--font-mono); letter-spacing: .03em; }

      /* AI 占卜解读区 */
      #readingResult {
        position: relative;
        background: var(--glass-strong); border: 1px solid var(--glass-border);
        border-radius: var(--r-md); padding: 22px; margin: 16px 0;
        text-align: left; font-size: 15px; line-height: 1.85; color: #f0ecf8;
        min-height: 60px; max-height: 400px; overflow-y: auto;
        white-space: pre-wrap; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
        box-shadow: inset 0 1px 0 var(--glass-inner);
      }
      #readingResult::-webkit-scrollbar { width: 4px; }
      #readingResult::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 10px; }
      #readingResult.loading::before {
        content: "🔮 占卜解读中"; display: block; text-align: center;
        color: var(--gold); font-size: 16px; animation: pulse 1.2s ease-in-out infinite;
      }
      #readingResult.follow-loading::before {
        content: "🔮 思考中…"; display: block; text-align: center;
        color: var(--gold); font-size: 16px; animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse { 0%,100%{ opacity:.4; transform:scale(.98);} 50%{ opacity:1; transform:scale(1);} }
      #readingResult .error { color: #ff6b6b; text-align: center; }

      .btn-reset {
        background: var(--glass-strong); border: 1px solid var(--glass-border);
        color: #fff; padding: 11px 32px; border-radius: 30px; cursor: pointer;
        transition: background .2s, transform .2s; font-family: inherit; font-size: 14.5px;
      }
      .btn-reset:hover { background: rgba(255,255,255,.2); transform: translateY(-2px); }

      /* 追问区域 */
      #followUpArea {
        display: none; margin-top: 20px; padding-top: 20px;
        border-top: 1px solid var(--glass-border);
      }
      #followUpArea .follow-label { font-size: 14px; color: var(--text-mut); margin-bottom: 10px; display: block; }
      #followUpArea .follow-input-group { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
      #followUpArea input {
        flex: 1; min-width: 200px;
        background: var(--glass-strong); border: 1px solid var(--glass-border);
        border-radius: 40px; padding: 12px 20px; color: #fff; font-size: 15px;
        outline: none; transition: border-color .3s, box-shadow .3s; font-family: inherit;
      }
      #followUpArea input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(179,136,255,.15); }
      #followUpArea input::placeholder { color: rgba(255,255,255,.4); }
      .btn-follow {
        background: linear-gradient(135deg, var(--gold), #f0a93f);
        border: none; color: #1b0f33; padding: 12px 28px; border-radius: 40px;
        font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit;
        transition: transform .2s cubic-bezier(.2,.8,.2,1), box-shadow .25s; white-space: nowrap;
      }
      .btn-follow:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(232,197,106,.4); }
      .btn-follow:active { transform: scale(.95); }
      .btn-follow:disabled { opacity: .5; cursor: not-allowed; transform: none; }

      /* 无障碍焦点 */
      input:focus-visible, button:focus-visible, .mini-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      /* 响应式 */
      @media (max-width: 480px) {
        .mini-card { width: 41px; height: 57px; font-size: 16px; }
        .result-card { min-height: 120px; padding: 10px 5px; }
        .result-card .cn { font-size: 15px; }
        #followUpArea .follow-input-group { flex-direction: column; }
        #followUpArea input { width: 100%; min-width: unset; }
        .btn-follow { width: 100%; }
      }
      @media (prefers-reduced-motion: reduce) {
        * { animation-duration: .001s !important; transition-duration: .001s !important; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>✦ 心念塔罗</h1>
        <p class="sub">三牌阵 · 抽取你的答案</p>
      </div>

      <!-- 步骤1：输入问题 -->
      <div id="stepInput">
        <input type="text" id="questionInput" placeholder="请输入你心中想问的问题…" maxlength="50" />
        <button class="btn-main" id="confirmBtn">确认问题，开始抽牌 ✨</button>
      </div>

      <!-- 步骤2：选择3张牌 -->
      <div id="stepSelect">
        <div class="instruction">
          请在下方牌阵中，选择你心仪的 <span>3</span> 张牌（已选 <span id="selectCount">0</span>/3）
        </div>
        <div id="cardGrid"></div>
        <button class="btn-main" id="revealBtn" disabled>揭示命运之牌 🔮</button>
      </div>

      <!-- 步骤3：展示结果 -->
      <div id="stepResult">
        <div class="result-grid" id="resultGrid"></div>
        <div id="readingResult"></div>

        <div id="followUpArea">
          <span class="follow-label">💬 继续追问（AI 会结合上下文回答）</span>
          <div class="follow-input-group">
            <input type="text" id="followInput" placeholder="输入你想追问的问题…" maxlength="100" />
            <button class="btn-follow" id="followBtn">发送追问 ✨</button>
          </div>
        </div>

        <button class="btn-reset" id="resetBtn">🔄 重新占卜</button>
      </div>
    </div>

    <script>
      // --- 1. 塔罗牌数据 (78张) ---
      const tarotDeck = [
        "愚者 The Fool","魔术师 The Magician","女祭司 The High Priestess","女皇 The Empress","皇帝 The Emperor",
        "教皇 The Hierophant","恋人 The Lovers","战车 The Chariot","力量 Strength","隐者 The Hermit",
        "命运之轮 Wheel of Fortune","正义 Justice","倒吊人 The Hanged Man","死神 Death","节制 Temperance",
        "恶魔 The Devil","高塔 The Tower","星星 The Star","月亮 The Moon","太阳 The Sun",
        "审判 Judgement","世界 The World","权杖王牌 Ace of Wands","权杖二 Two of Wands","权杖三 Three of Wands",
        "权杖四 Four of Wands","权杖五 Five of Wands","权杖六 Six of Wands","权杖七 Seven of Wands","权杖八 Eight of Wands",
        "权杖九 Nine of Wands","权杖十 Ten of Wands","权杖侍从 Page of Wands","权杖骑士 Knight of Wands","权杖王后 Queen of Wands",
        "权杖国王 King of Wands","圣杯王牌 Ace of Cups","圣杯二 Two of Cups","圣杯三 Three of Cups","圣杯四 Four of Cups",
        "圣杯五 Five of Cups","圣杯六 Six of Cups","圣杯七 Seven of Cups","圣杯八 Eight of Cups","圣杯九 Nine of Cups",
        "圣杯十 Ten of Cups","圣杯侍从 Page of Cups","圣杯骑士 Knight of Cups","圣杯王后 Queen of Cups","圣杯国王 King of Cups",
        "宝剑王牌 Ace of Swords","宝剑二 Two of Swords","宝剑三 Three of Swords","宝剑四 Four of Swords","宝剑五 Five of Swords",
        "宝剑六 Six of Swords","宝剑七 Seven of Swords","宝剑八 Eight of Swords","宝剑九 Nine of Swords","宝剑十 Ten of Swords",
        "宝剑侍从 Page of Swords","宝剑骑士 Knight of Swords","宝剑王后 Queen of Swords","宝剑国王 King of Swords",
        "星币王牌 Ace of Pentacles","星币二 Two of Pentacles","星币三 Three of Pentacles","星币四 Four of Pentacles","星币五 Five of Pentacles",
        "星币六 Six of Pentacles","星币七 Seven of Pentacles","星币八 Eight of Pentacles","星币九 Nine of Pentacles","星币十 Ten of Pentacles",
        "星币侍从 Page of Pentacles","星币骑士 Knight of Pentacles","星币王后 Queen of Pentacles","星币国王 King of Pentacles"
      ];

      const icons = ["🌿","🔥","💧","🌪️","⭐","🌙","☀️","🌹","🗡️","💰","🦁","👑"];

      // --- 2. DOM元素 ---
      const stepInput = document.getElementById("stepInput");
      const stepSelect = document.getElementById("stepSelect");
      const stepResult = document.getElementById("stepResult");
      const questionInput = document.getElementById("questionInput");
      const confirmBtn = document.getElementById("confirmBtn");
      const cardGrid = document.getElementById("cardGrid");
      const selectCount = document.getElementById("selectCount");
      const revealBtn = document.getElementById("revealBtn");
      const resultGrid = document.getElementById("resultGrid");
      const resetBtn = document.getElementById("resetBtn");
      const readingEl = document.getElementById("readingResult");
      const followUpArea = document.getElementById("followUpArea");
      const followInput = document.getElementById("followInput");
      const followBtn = document.getElementById("followBtn");

      // --- 3. 状态变量 ---
      let selectedCards = [];
      let currentQuestion = "";
      let conversationHistory = [];

      // --- 4. 步骤1：确认问题 ---
      confirmBtn.addEventListener("click", () => {
        const q = questionInput.value.trim();
        if (!q) {
          questionInput.classList.add("error-shake");
          setTimeout(() => questionInput.classList.remove("error-shake"), 450);
          return;
        }
        currentQuestion = q;
        conversationHistory = [];
        stepInput.style.display = "none";
        stepSelect.style.display = "flex";
        generateCardGrid();
      });

      questionInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") confirmBtn.click();
      });

      // --- 5. 步骤2：生成牌阵并抽牌 ---
      function generateCardGrid() {
        cardGrid.innerHTML = "";
        selectedCards = [];
        selectCount.textContent = "0";
        revealBtn.disabled = true;
        for (let i = 0; i < 78; i++) {
          const cardEl = document.createElement("button");
          cardEl.className = "mini-card";
          cardEl.type = "button";
          cardEl.textContent = "✦";
          cardEl.dataset.index = i;
          cardEl.addEventListener("click", () => handleCardClick(cardEl, i));
          cardGrid.appendChild(cardEl);
        }
      }

      function handleCardClick(el, index) {
        if (selectedCards.length >= 3 || el.classList.contains("selected")) return;
        const randomIndex = Math.floor(Math.random() * tarotDeck.length);
        const rawName = tarotDeck[randomIndex];
        let cn = rawName, en = "";
        if (rawName.includes(" ")) {
          const space = rawName.indexOf(" ");
          cn = rawName.substring(0, space);
          en = rawName.substring(space + 1);
        }
        selectedCards.push({ name: rawName, cn, en, icon: icons[Math.floor(Math.random() * icons.length)] });
        el.textContent = icons[Math.floor(Math.random() * icons.length)];
        el.style.fontSize = "24px";
        el.style.color = "#fff";
        el.style.background = "linear-gradient(160deg, #f8f7fc, #e2dfec)";
        el.classList.add("selected");
        selectCount.textContent = selectedCards.length;
        if (selectedCards.length === 3) revealBtn.disabled = false;
      }

      // --- 6. 核心：调用API（流式，带上下文） ---
      async function callTarotAPI(messages, targetElement, isFollowUp = false) {
        targetElement.className = isFollowUp ? "follow-loading" : "loading";
        targetElement.textContent = "";
        try {
          const response = await fetch("https://taluo.banqiuxy.top/", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ model: "deepseek-v4-flash", messages, stream: true })
          });
          if (!response.ok) throw new Error("API 请求失败 (" + response.status + ")");
          targetElement.className = "";
          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split("\n");
            buffer = lines.pop() || "";
            for (const line of lines) {
              if (line.startsWith("data: ")) {
                const data = line.slice(6).trim();
                if (data === "[DONE]") continue;
                try {
                  const parsed = JSON.parse(data);
                  const content = parsed.choices?.[0]?.delta?.content || "";
                  if (content) { targetElement.textContent += content; targetElement.scrollTop = targetElement.scrollHeight; }
                } catch {}
              }
            }
          }
          followUpArea.style.display = "block";
          followInput.value = "";
          followBtn.disabled = false;
          followInput.focus();
          return true;
        } catch (err) {
          targetElement.className = "";
          targetElement.innerHTML = '<div class="error">❌ 网络错误，请稍后重试</div>';
          console.error("API 调用出错:", err);
          return false;
        }
      }

      // --- 7. 揭示命运之牌 + 首次解读 ---
      revealBtn.addEventListener("click", async () => {
        stepSelect.style.display = "none";
        stepResult.style.display = "block";
        resultGrid.innerHTML = "";
        selectedCards.forEach((card) => {
          const div = document.createElement("div");
          div.className = "result-card";
          div.innerHTML = '<div class="icon">' + card.icon + '</div><div class="cn">' + card.cn + '</div><div class="en">' + card.en + '</div>';
          resultGrid.appendChild(div);
        });

        const systemPrompt = "你是一个友好、专业、有帮助的塔罗牌占卜师，你有超过多年的塔罗牌占卜经验，请你根据用户输入的问题和用户抽到的三张塔罗牌进行分析占卜。请注意，在你每次输出完毕的最后面要加上温馨提示提示用户占卜结果仅为心理趋势参考不可当真仅供娱乐类似的提示。";
        const cardNames = selectedCards.map(c => c.name).join("、");
        const userMessage = "帮我解牌并分析塔罗牌，我的问题是「" + currentQuestion + "」，我抽到的塔罗牌是「" + cardNames + "」，请你帮我解牌。";
        conversationHistory = [
          { role: "system", content: systemPrompt },
          { role: "user", content: userMessage }
        ];
        await callTarotAPI(conversationHistory, readingEl, false);
      });

      // --- 8. 追问功能 ---
      followBtn.addEventListener("click", async () => {
        const followQuestion = followInput.value.trim();
        if (!followQuestion) {
          followInput.classList.add("error-shake");
          setTimeout(() => followInput.classList.remove("error-shake"), 450);
          return;
        }
        followBtn.disabled = true;
        followInput.disabled = true;
        conversationHistory.push({ role: "user", content: followQuestion });
        await callTarotAPI(conversationHistory, readingEl, true);
        conversationHistory.push({ role: "assistant", content: readingEl.textContent });
        followBtn.disabled = false;
        followInput.disabled = false;
        followInput.value = "";
        followInput.focus();
      });

      followInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") followBtn.click();
      });

      // --- 9. 重置 ---
      resetBtn.addEventListener("click", () => {
        stepResult.style.display = "none";
        stepInput.style.display = "flex";
        questionInput.value = "";
        questionInput.focus();
        followUpArea.style.display = "none";
        readingEl.textContent = "";
        readingEl.className = "";
        conversationHistory = [];
        selectedCards = [];
      });
    </script>
  </body>
</html>
