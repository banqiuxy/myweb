<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>沉浸式塔罗占卜 - 半秋的小站</title>
  <meta name="description" content="心念塔罗 · 三牌阵抽取，输入你的问题，AI 为你解读，支持连续追问。">
  <link rel="stylesheet" href="tarot.css">
</head>
<body>

  <!-- 星空背景 -->
  <div class="stars" id="stars"></div>

  <!-- 顶部栏 -->
  <nav class="topbar">
    <div class="brand"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#b388ff" stroke-width="2" style="vertical-align:-4px;margin-right:6px;"><circle cx="12" cy="14" r="7"/><path d="M12 3v2"/><path d="m5.6 5.6 1.4 1.4"/><path d="m18.4 5.6-1.4 1.4"/></svg>AI 塔罗占卜</div>
    <div class="topbar-actions">
      <button class="restart-btn" id="restartTop"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:5px;"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>重新占卜</button>
    </div>
  </nav>

  <!-- ====== 步骤一 · 提问 ====== -->
  <section class="step active" id="step-ask">
    <div class="card">
      <h1 class="title">心念塔罗</h1>
      <p class="subtitle">三牌阵抽取 · AI 为你解读 · 支持连续追问</p>
      <div class="ask-box">
        <input type="text" id="questionInput" maxlength="50"
               placeholder="请输入你心中想问的问题..." autocomplete="off">
        <button class="primary-btn" id="askBtn"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-3px;margin-right:6px;"><path d="M12 3l2.1 6.2L20 11.6l-5.9 2.4L12 20l-2.1-6.2L4 11.6l5.9-2.4z"/></svg>确认问题，开始抽牌</button>
      </div>
    </div>
  </section>

  <!-- ====== 步骤二 · 选牌 ====== -->
  <section class="step" id="step-pick">
    <div class="card">
      <p class="pick-tip">请在下方牌阵中，选择你心仪的 3 张牌（已选 <span class="gold" id="pickCount">0</span>/3）</p>
      <div class="deck" id="deck"></div>
      <button class="primary-btn" id="revealBtn" disabled><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-3px;margin-right:6px;"><circle cx="12" cy="14" r="7"/><path d="M12 3v2"/><path d="m5.6 5.6 1.4 1.4"/><path d="m18.4 5.6-1.4 1.4"/></svg>揭示命运之牌</button>
    </div>
  </section>

  <!-- ====== 步骤三 · 解读 + 追问 ====== -->
  <section class="step" id="step-reading">
    <div class="card">
      <p class="reading-sub">你的三张命运之牌</p>
      <div class="cards-row" id="cardsRow"></div>

      <!-- AI 解读区 -->
      <div class="reading-area">
        <div class="reading-loading" id="readingLoading"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#ffd966" stroke-width="2" style="vertical-align:-3px;margin-right:6px;"><circle cx="12" cy="14" r="7"/><path d="M12 3v2"/><path d="m5.6 5.6 1.4 1.4"/><path d="m18.4 5.6-1.4 1.4"/></svg>占卜解读中</div>
        <div class="reading-error hidden" id="readingError"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-3px;margin-right:5px;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>网络错误，请稍后重试</div>
        <div class="reading-content hidden" id="readingContent"></div>
      </div>

      <!-- 追问区 -->
      <div class="follow-area hidden" id="followArea">
        <p class="follow-tip"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#ffd966" stroke-width="2" style="vertical-align:-3px;margin-right:5px;"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>继续追问（AI会结合上下文回答）</p>
        <div class="follow-box">
          <input type="text" id="followInput" maxlength="100"
                 placeholder="输入你想追问的问题..." autocomplete="off">
          <button class="primary-btn" id="followBtn"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-3px;margin-right:5px;"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>发送追问</button>
        </div>
        <div class="follow-loading hidden" id="followLoading"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#ffd966" stroke-width="2" style="vertical-align:-3px;margin-right:6px;"><circle cx="12" cy="14" r="7"/><path d="M12 3v2"/><path d="m5.6 5.6 1.4 1.4"/><path d="m18.4 5.6-1.4 1.4"/></svg>思考中...</div>
        <div class="follow-answer hidden" id="followAnswer"></div>
      </div>

      <button class="restart-btn center" id="restartBottom"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:5px;"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>重新占卜</button>
    </div>
  </section>

  <script src="tarot-deck.js"></script>
  <script src="tarot.js"></script>
</body>
</html>
